name: Release

# Cuts a release of a branch: tag → GitHub release (auto-generated notes) → container image.
# What merged since the branch's last release decides it (VERSIONING.md, computed by
# .github/scripts/next-version.sh): only commits that change what ships count, and a feat raises
# the minor, a fix or runtime dependency update the patch. Docs, tests, CI, the website and the
# e2e backend pins alone release nothing.
#
#   main          vMAJOR.Y.0 or vMAJOR.Y.Z, the stable line (MAJOR from .release-major)
#   next          vMAJOR.0.0-alpha.N / -beta.N / -rc.N pre-releases of the next major
#   release-X.Y   vX.Y.Z patches of an older line, never marked Latest
#
# Every Friday it releases main and next (when it exists); a branch with nothing to release is
# skipped. Run it by hand for a branch now (an urgent fix), a channel or an explicit version
# (e.g. v2.0.0 at the cutover).
#
# Tag-driven: the git tag is the version source of truth — package.json is NOT modified, and
# image-build.yaml injects the version into the image (ENV.VERSION) at build time.
on:
  schedule:
    - cron: "0 6 * * 5" # Fridays 06:00 UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to release: main, next or release-X.Y"
        required: true
        default: main
        type: string
      channel:
        description: "Pre-release channel (next only)"
        required: true
        default: alpha
        type: choice
        options: [alpha, beta, rc]
      version:
        description: "Explicit version with the v, e.g. v2.0.0 (empty: computed from the branch)"
        required: false
        type: string

permissions:
  contents: write # create the tag and the GitHub release
  actions: write # dispatch image-build.yaml

jobs:
  branches:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.refs.outputs.refs }}
    steps:
      - id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_REF: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = schedule ]; then candidates="main next"; else candidates="$INPUT_REF"; fi
          refs=()
          for ref in $candidates; do
            if gh api "repos/$REPO/branches/$ref" --silent 2>/dev/null; then
              refs+=("$ref")
            elif [ "$EVENT" = schedule ]; then
              echo "::notice::There is no $ref branch; skipped"
            else
              echo "::error::There is no $ref branch"
              exit 1
            fi
          done
          echo "refs=$(printf '%s\n' "${refs[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

  release:
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJson(needs.branches.outputs.refs) }}
    concurrency:
      group: release-${{ matrix.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0 # full history + all tags, for the version and the notes
          fetch-tags: true

      - name: Determine version
        id: plan
        env:
          RELEASE_REF: ${{ matrix.ref }}
          RELEASE_CHANNEL: ${{ inputs.channel || 'alpha' }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          .github/scripts/next-version.sh | tee -a "$GITHUB_OUTPUT"

      - name: Tag and push
        if: steps.plan.outputs.release == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Tag the branch's current commit. Pushing a tag is allowed (only branches are
          # protected), and the git tag is the version source of truth.
          git tag -a "$TAG" -m "Release ${TAG#v}"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          LATEST: ${{ steps.plan.outputs.latest }}
          PREVIOUS: ${{ steps.plan.outputs.previous }}
        run: |
          set -euo pipefail
          # Pre-releases are never Latest; a stable release only when it is the highest version.
          # The notes start from the previous release of this branch, not GitHub's guess.
          flags=(--latest="$LATEST")
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if [ -n "$PREVIOUS" ]; then flags+=(--notes-start-tag "$PREVIOUS"); fi
          gh release create "$TAG" --title "Release ${TAG#v}" --generate-notes --verify-tag "${flags[@]}"

      - name: Build the container image for the release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          # A tag pushed with GITHUB_TOKEN triggers no workflow, so dispatch image-build.yaml on
          # it: its semver metadata produces the image tags, injects the version into the image,
          # and signs + attests it.
          gh workflow run image-build.yaml --ref "$TAG"
