name: Update Pulp plugin versions

# Daily, bump each plugin row in plugin-versions.txt to the plugin's latest GitHub
# release and open a PR. The PR's e2e run clones those pinned tags into /src and
# tests them; auto-merge lands it once the required checks pass — so we track the
# latest Pulp without ever merging a breaking bump by hand. oci_env has no releases,
# so it tracks main and is bumped manually.
#
# The same PR regenerates client/openapi/pulp.json from a backend booted at the bumped
# versions, so the spec always matches the pins. When the API changed in a way the UI must
# follow (a new field a form doesn't cover, a removed endpoint), the PR's checks fail and
# the fix is pushed to the PR branch; later runs leave a bump PR with such commits alone.
#
# Setup required: the pulp-ui-bot GitHub App (contents + pull-requests write), with its App ID
# in the BOT_APP_ID variable and its private key in the BOT_APP_PRIVATE_KEY secret. The PR is
# opened and auto-merge enabled with the App's token: GITHUB_TOKEN would neither trigger e2e on
# the PR nor the push workflows (image, website) on main after the merge.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Pull the oci-env base image the e2e workflow publishes to ghcr.
  packages: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get bot token
        id: app-token
        uses: actions/create-github-app-token@v2.2.2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Get bot user id
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      # create-pull-request recreates the branch as one commit on main; a bump PR with more
      # commits has fixes pushed by hand, which a new run would wipe out.
      - name: Leave a bump PR with manual fixes alone
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          commits="$(gh pr list --repo "$REPO" --head ci/bump-plugin-versions --state open \
            --json commits --jq '[.[].commits | length] | max // 0')"
          if [ "$commits" -gt 1 ]; then
            echo "::notice::The open bump PR has $commits commits (fixes pushed by hand); not touching it."
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Bump plugin rows to latest releases
        id: bump
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=0
          tmp="$(mktemp)"
          while IFS= read -r line; do
            # Preserve comments and blank lines verbatim.
            case "$line" in
              '' | \#*)
                printf '%s\n' "$line" >>"$tmp"
                continue
                ;;
            esac
            repo="$(printf '%s' "$line" | awk '{print $1}')"
            ref="$(printf '%s' "$line" | awk '{print $2}')"
            # oci_env has no releases — leave it (and anything unexpected) untouched.
            if [ "$repo" = "oci_env" ]; then
              printf '%s\n' "$line" >>"$tmp"
              continue
            fi
            # Use releases/latest, not the tags list: some repos carry noisy,
            # non-release tags that sort above the real latest release.
            latest="$(gh api "repos/pulp/$repo/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")"
            if [ -z "$latest" ] || [ "$latest" = "$ref" ]; then
              printf '%s\n' "$line" >>"$tmp"
              continue
            fi
            printf '%-20s %s\n' "$repo" "$latest" >>"$tmp"
            echo "  $repo: $ref -> $latest"
            changed=1
          done <plugin-versions.txt
          mv "$tmp" plugin-versions.txt
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

      # Boot the backend at the bumped versions, as the e2e workflow does, to dump its spec.
      - name: Set up oci-env
        if: steps.bump.outputs.changed == '1'
        uses: $/.github/actions/pulp-oci-env
        with:
          domain-enabled: "true"
          clone-plugins: "true"

      - name: Log in to ghcr
        if: steps.bump.outputs.changed == '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The base image holds no plugins (they install from /src at boot), so the latest one
      # the e2e workflow built serves any pins.
      - name: Pull the backend base image
        if: steps.bump.outputs.changed == '1'
        env:
          REPO: ${{ github.repository }}
        run: |
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/pulp-backend:latest"
          docker pull "$image"
          docker tag "$image" localhost/oci_env/pulp:base

      - name: Start Pulp
        if: steps.bump.outputs.changed == '1'
        run: oci-env -e compose.ci.env compose up -d

      - name: Wait for Pulp API
        if: steps.bump.outputs.changed == '1'
        run: |
          for i in $(seq 1 180); do
            if curl -fsS http://localhost:5003/api/pulp/api/v3/status/ >/dev/null; then
              echo "Pulp is ready"
              exit 0
            fi
            echo "Waiting for Pulp... ($i)"
            sleep 5
          done
          echo "Pulp did not become ready in time"
          oci-env -e compose.ci.env compose logs --tail=200
          exit 1

      - name: Refresh the OpenAPI spec
        if: steps.bump.outputs.changed == '1'
        run: scripts/backend/openapi.sh

      - name: Create pull request
        id: cpr
        if: steps.bump.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.bot-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.bot-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          branch: ci/bump-plugin-versions
          delete-branch: true
          # The backend setup writes compose.ci.env into the checkout; commit only these.
          add-paths: |
            plugin-versions.txt
            client/openapi/pulp.json
          commit-message: "ci(deps): bump Pulp plugin versions to latest releases"
          title: "ci(deps): bump Pulp plugin versions to latest releases"
          body: |
            Automated bump of `plugin-versions.txt` to the latest GitHub release of
            each Pulp plugin, with `client/openapi/pulp.json` regenerated from a backend
            running these versions.

            The e2e suite runs against these versions on this PR and gates the merge. If a
            check fails because the API changed, push the UI fix to this branch: later
            runs leave a bump PR with extra commits alone.
          labels: dependencies

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash
