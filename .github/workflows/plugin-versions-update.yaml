name: Update Pulp plugin versions

# Daily, bump each plugin row in plugin-versions.txt to the plugin's latest GitHub
# release and open a PR. The PR's e2e run clones those pinned tags into /src and
# tests them; auto-merge lands it once the required checks pass — so we track the
# latest Pulp without ever merging a breaking bump by hand. oci_env has no releases,
# so it tracks main and is bumped manually. A plugin with no release yet (pinned to a SHA)
# is left as is until it publishes one, then moved to that release tag.
#
# Setup required: the pulp-ui-bot GitHub App (contents + pull-requests write), with its App ID
# in the BOT_APP_ID variable and its private key in the BOT_APP_PRIVATE_KEY secret. The PR is
# opened and auto-merge enabled with the App's token: GITHUB_TOKEN would neither trigger e2e on
# the PR nor the push workflows (image, website) on main after the merge.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get bot token
        id: app-token
        uses: actions/create-github-app-token@v2.2.2
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Get bot user id
        id: bot-user
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - name: Bump plugin rows to latest releases
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=0
          tmp="$(mktemp)"
          while IFS= read -r line; do
            # Preserve comments and blank lines verbatim.
            case "$line" in
              '' | \#*)
                printf '%s\n' "$line" >>"$tmp"
                continue
                ;;
            esac
            repo="$(printf '%s' "$line" | awk '{print $1}')"
            ref="$(printf '%s' "$line" | awk '{print $2}')"
            # oci_env has no releases — leave it (and anything unexpected) untouched.
            if [ "$repo" = "oci_env" ]; then
              printf '%s\n' "$line" >>"$tmp"
              continue
            fi
            # Use releases/latest, not the tags list: some repos carry noisy,
            # non-release tags that sort above the real latest release. Trust gh's
            # exit status: on a 404 (no release yet) it still prints the error JSON.
            latest="$(gh api "repos/pulp/$repo/releases/latest" --jq '.tag_name' 2>/dev/null)" || latest=""
            if [ -z "$latest" ] || [ "$latest" = "$ref" ]; then
              printf '%s\n' "$line" >>"$tmp"
              continue
            fi
            printf '%-20s %s\n' "$repo" "$latest" >>"$tmp"
            echo "  $repo: $ref -> $latest"
            changed=1
          done <plugin-versions.txt
          mv "$tmp" plugin-versions.txt
          echo "changed=$changed" >>"$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        if: steps.bump.outputs.changed == '1'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.bot-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          committer: ${{ steps.app-token.outputs.app-slug }}[bot] <${{ steps.bot-user.outputs.id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com>
          branch: ci/bump-plugin-versions
          delete-branch: true
          commit-message: "ci(deps): bump Pulp plugin versions to latest releases"
          title: "ci(deps): bump Pulp plugin versions to latest releases"
          body: |
            Automated bump of `plugin-versions.txt` to the latest GitHub release of
            each Pulp plugin.

            The e2e suite runs against these versions on this PR and gates the merge.
          labels: dependencies

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.cpr.outputs.pull-request-number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --auto --squash
