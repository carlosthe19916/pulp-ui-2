name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Each entry is its own job with its own Pulp backend, so the shards run
        # in parallel with no shared-backend contention. The main suite (the
        # chromium project, which ignores access-policies) is split into 4 shards
        # under domains=enabled; access-policies runs on its own (serial); the
        # domains=disabled leg re-checks only the @smoke flows on the no-domains
        # code path.
        include:
          - {
              name: main-1,
              domains: enabled,
              args: "--project=chromium --shard=1/4",
            }
          - {
              name: main-2,
              domains: enabled,
              args: "--project=chromium --shard=2/4",
            }
          - {
              name: main-3,
              domains: enabled,
              args: "--project=chromium --shard=3/4",
            }
          - {
              name: main-4,
              domains: enabled,
              args: "--project=chromium --shard=4/4",
            }
          - {
              name: access-policies,
              domains: enabled,
              args: "--project=access-policies",
            }
          - {
              name: smoke-no-domains,
              domains: disabled,
              args: "--project=chromium --grep @smoke",
            }
    env:
      PULP_API_URL: http://localhost:8080
      E2E_USERNAME: admin
      E2E_PASSWORD: password
      # Consumed by docker-compose.yml to toggle the Pulp domains feature.
      PULP_DOMAIN_ENABLED: ${{ matrix.domains == 'enabled' }}
    steps:
      - uses: actions/checkout@v6

      - name: Start Pulp
        run: docker compose -f docker-compose.yml up -d

      - name: Wait for Pulp API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS "${PULP_API_URL}/api/pulp/api/v3/status/" >/dev/null; then
              echo "Pulp is ready"
              exit 0
            fi
            echo "Waiting for Pulp... ($i)"
            sleep 5
          done
          echo "Pulp did not become ready in time"
          docker compose -f docker-compose.yml logs
          exit 1

      - name: Set Pulp admin password
        run: >
          docker compose -f docker-compose.yml exec -T pulp
          pulpcore-manager reset-admin-password --password "${E2E_PASSWORD}"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      - run: npx playwright test ${{ matrix.args }}
        working-directory: e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: e2e/playwright-report/

      - name: Stop Pulp
        if: always()
        run: docker compose -f docker-compose.yml down -v
