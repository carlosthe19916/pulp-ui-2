name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Stacked branches (whose PRs target another branch) run it by hand.
  workflow_dispatch:

env:
  # Fork-fallback tarball path (when we cannot push to / pull from ghcr).
  BACKEND_IMAGE: /tmp/pulp-backend-image.tar
  # Bump when the base image build recipe changes in a way the oci_env base/ tree
  # hash does not capture (e.g. a drift of the upstream pulp-ci-centos10:latest base).
  BACKEND_RECIPE: r1
  # Extra dev libs baked onto the base image for pulp_ostree (single-sourced: used
  # both in the image-tag hash and the docker build below).
  EXTRA_DEV_LIBS: cairo-devel cairo-gobject-devel gobject-introspection-devel ostree-devel

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      app: ${{ steps.areas.outputs.app }}
    steps:
      - uses: actions/checkout@v6
      - id: areas
        uses: $/.github/actions/changed-areas

  # Publish the oci-env base image to ghcr once, then reuse it across the e2e matrix.
  #
  # The base image (localhost/oci_env/pulp:base) bakes only the OS + deps from
  # oci_env's base/ dir plus our extra dev libs — it has NO Pulp plugins. Plugins
  # (including pulpcore) install editable from the /src mount at container startup,
  # pinned by plugin-versions.txt. So the image tag tracks the oci_env base/ tree,
  # NOT plugin-versions.txt: a daily plugin bump reuses the already-published image.
  build-backend:
    needs: changes
    # Skip the whole e2e pipeline for website-only changes. Each matrix leg's
    # skipped status counts as a passing required check, so auto-merge isn't
    # blocked and no Pulp backend is ever built.
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    name: build oci-env backend
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
      available: ${{ steps.availability.outputs.available }}
    steps:
      - uses: actions/checkout@v6

      - name: Determine push capability
        id: perm
        # Fork PRs get a read-only token, so they cannot push to ghcr; same-repo
        # PRs and pushes can.
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "push" ] || [ "$HEAD_REPO" = "$REPO" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to ghcr
        if: steps.perm.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute base image ref
        id: meta
        env:
          REPO: ${{ github.repository }}
          RECIPE: ${{ env.BACKEND_RECIPE }}
          DEV_LIBS: ${{ env.EXTRA_DEV_LIBS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')/pulp-backend"
          oci_ref="$(awk '$1=="oci_env"{print $2}' plugin-versions.txt)"
          # Tag the base image by the oci_env base/ subtree (what actually goes into
          # the image) + the extra dev libs + a manual recipe knob.
          base_tree="$(gh api "repos/pulp/oci_env/git/trees/${oci_ref}" \
            --jq '.tree[] | select(.path=="base").sha')"
          hash="$(printf '%s\n' "$base_tree" "$DEV_LIBS" "$RECIPE" \
            | sha256sum | cut -c1-16)"
          tag="${RECIPE}-${hash}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Backend base image: $image:$tag"

      - name: Check whether base image is already published
        id: check
        env:
          REF: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "$REF already published."
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "$REF not found; will build from source."
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
          fi

      # Only oci_env is needed to build the base image (plugins are not baked in).
      - name: Set up oci-env
        if: steps.check.outputs.needs_build == 'true'
        uses: $/.github/actions/pulp-oci-env
        with:
          clone-plugins: "false"

      - name: Build base image
        if: steps.check.outputs.needs_build == 'true'
        run: |
          oci-env -e compose.ci.env compose build
          # pulp_ostree builds PyGObject/pycairo from source at container start; bake
          # in the dev libs the upstream base image's drifting :latest no longer ships.
          printf '%s\n' \
            'FROM localhost/oci_env/pulp:base' \
            "RUN dnf -y install ${EXTRA_DEV_LIBS} && dnf clean all" \
            | docker build -t localhost/oci_env/pulp:base -f - .

      - name: Push base image
        if: steps.check.outputs.needs_build == 'true' && steps.perm.outputs.can_push == 'true'
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAG: ${{ steps.meta.outputs.tag }}
          IS_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          SHA: ${{ github.sha }}
        run: |
          docker tag localhost/oci_env/pulp:base "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          # Also publish moving tags on main for traceability / manual pulls.
          if [ "$IS_MAIN" = "true" ]; then
            for extra in latest "sha-$SHA"; do
              docker tag localhost/oci_env/pulp:base "$IMAGE:$extra"
              docker push "$IMAGE:$extra"
            done
          fi

      # Fork PRs cannot push; hand the freshly built image to the matrix via an artifact.
      - name: Save base image for fork fallback
        if: steps.check.outputs.needs_build == 'true' && steps.perm.outputs.can_push != 'true'
        run: docker save -o "${BACKEND_IMAGE}" localhost/oci_env/pulp:base

      - name: Upload base image artifact (fork fallback)
        if: steps.check.outputs.needs_build == 'true' && steps.perm.outputs.can_push != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pulp-backend-image
          path: ${{ env.BACKEND_IMAGE }}
          retention-days: 1

      - name: Report image source for the matrix
        id: availability
        env:
          NEEDS_BUILD: ${{ steps.check.outputs.needs_build }}
          CAN_PUSH: ${{ steps.perm.outputs.can_push }}
        run: |
          # "registry": pull from ghcr (already published or just pushed).
          # "artifact": download the fork-fallback tarball built above.
          if [ "$NEEDS_BUILD" = "false" ] || [ "$CAN_PUSH" = "true" ]; then
            echo "available=registry" >> "$GITHUB_OUTPUT"
          else
            echo "available=artifact" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: [changes, build-backend]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    name: e2e (${{ matrix.name }})
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # Each entry is its own job with its own Pulp backend, so the shards run
        # in parallel with no shared-backend contention. The main suite (the
        # chromium project, which ignores access-policies) is split into 3 shards
        # under domains=enabled; access-policies runs on its own (serial); the
        # domains=disabled leg re-checks only the @smoke flows on the no-domains
        # code path.
        include:
          - {
              name: main-1,
              domains: enabled,
              args: "--project=chromium --shard=1/3",
            }
          - {
              name: main-2,
              domains: enabled,
              args: "--project=chromium --shard=2/3",
            }
          - {
              name: main-3,
              domains: enabled,
              args: "--project=chromium --shard=3/3",
            }
          - {
              name: access-policies,
              domains: enabled,
              args: "--project=access-policies",
            }
          - {
              name: smoke-no-domains,
              domains: disabled,
              args: "--project=chromium --grep @smoke",
            }
    env:
      PULP_API_URL: http://localhost:5003
      E2E_USERNAME: admin
      E2E_PASSWORD: password
      PULP_DOMAIN_ENABLED: ${{ matrix.domains == 'enabled' }}
      BACKEND_IMAGE_REF: ${{ needs.build-backend.outputs.image }}:${{ needs.build-backend.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      # Plugins install from /src at container boot, so e2e needs all repos cloned.
      - name: Set up oci-env
        uses: $/.github/actions/pulp-oci-env
        with:
          domain-enabled: ${{ matrix.domains == 'enabled' }}
          clone-plugins: "true"

      - name: Log in to ghcr
        if: needs.build-backend.outputs.available == 'registry'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt base image (registry)
        if: needs.build-backend.outputs.available == 'registry'
        run: |
          # On a miss, compose up transparently rebuilds the base from source.
          if docker pull "$BACKEND_IMAGE_REF"; then
            docker tag "$BACKEND_IMAGE_REF" localhost/oci_env/pulp:base
          else
            echo "Pull failed; compose up will build the base from source."
          fi

      - name: Download prebuilt base image (fork fallback)
        if: needs.build-backend.outputs.available == 'artifact'
        uses: actions/download-artifact@v4
        with:
          name: pulp-backend-image
          path: /tmp

      - name: Load prebuilt base image (fork fallback)
        if: needs.build-backend.outputs.available == 'artifact'
        run: |
          [ -f "${BACKEND_IMAGE}" ] && docker load -i "${BACKEND_IMAGE}" \
            || echo "No artifact; compose up will build the base from source."

      - name: Start Pulp (oci-env)
        run: oci-env -e compose.ci.env compose up -d

      - name: Wait for Pulp API
        run: |
          for i in $(seq 1 180); do
            if curl -fsS "${PULP_API_URL}/api/pulp/api/v3/status/" >/dev/null; then
              echo "Pulp is ready"
              exit 0
            fi
            echo "Waiting for Pulp... ($i)"
            sleep 5
          done
          echo "Pulp did not become ready in time"
          oci-env -e compose.ci.env compose logs --tail=200
          exit 1

      - name: Set Pulp admin password
        run: >
          oci-env -e compose.ci.env pulpcore-manager
          reset-admin-password --password "${E2E_PASSWORD}"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (and deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e

      - run: npx playwright test ${{ matrix.args }}
        working-directory: e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: e2e/playwright-report/

      - name: Stop Pulp
        if: always()
        run: oci-env -e compose.ci.env compose down -v
