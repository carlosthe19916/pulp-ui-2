name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  BACKEND_IMAGE: /tmp/pulp-backend-image.tar

jobs:
  # Build the oci-env backend once and cache it for the e2e matrix.
  build-backend:
    runs-on: ubuntu-latest
    name: build oci-env backend
    steps:
      - uses: actions/checkout@v6

      - name: Restore backend image cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BACKEND_IMAGE }}
          # Bump vN when the image build changes so the cached image is rebuilt.
          key: pulp-backend-v3-${{ hashFiles('plugin-versions.txt', 'compose.env') }}

      - name: Set up oci-env
        if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/pulp-oci-env

      - name: Build backend image and save it
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          oci-env -e compose.ci.env compose build
          # pulp_ostree builds PyGObject/pycairo from source at container start; bake
          # in the dev libs the base image's drifting :latest no longer reliably ships.
          printf '%s\n' \
            'FROM localhost/oci_env/pulp:base' \
            'RUN dnf -y install cairo-devel cairo-gobject-devel gobject-introspection-devel ostree-devel && dnf clean all' \
            | docker build -t localhost/oci_env/pulp:base -f - .
          # Save by name:tag, not image ID: saving by ID drops the tag, so the load
          # leaves the image dangling and compose rebuilds it from scratch (without
          # the packages above). Fall back to all pulp-tagged images, else every tag.
          tags=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | awk 'tolower($0) ~ /pulp/ && $0 !~ /<none>/' | sort -u)
          [ -n "$tags" ] || tags=$(docker images --format '{{.Repository}}:{{.Tag}}' \
            | awk '$0 !~ /<none>/' | sort -u)
          docker save -o "${BACKEND_IMAGE}" $tags

  e2e:
    needs: build-backend
    runs-on: ubuntu-latest
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Each entry is its own job with its own Pulp backend, so the shards run
        # in parallel with no shared-backend contention. The main suite (the
        # chromium project, which ignores access-policies) is split into 4 shards
        # under domains=enabled; access-policies runs on its own (serial); the
        # domains=disabled leg re-checks only the @smoke flows on the no-domains
        # code path.
        include:
          - {
              name: main-1,
              domains: enabled,
              args: "--project=chromium --shard=1/4",
            }
          - {
              name: main-2,
              domains: enabled,
              args: "--project=chromium --shard=2/4",
            }
          - {
              name: main-3,
              domains: enabled,
              args: "--project=chromium --shard=3/4",
            }
          - {
              name: main-4,
              domains: enabled,
              args: "--project=chromium --shard=4/4",
            }
          - {
              name: access-policies,
              domains: enabled,
              args: "--project=access-policies",
            }
          - {
              name: smoke-no-domains,
              domains: disabled,
              args: "--project=chromium --grep @smoke",
            }
    env:
      PULP_API_URL: http://localhost:5003
      E2E_USERNAME: admin
      E2E_PASSWORD: password
      PULP_DOMAIN_ENABLED: ${{ matrix.domains == 'enabled' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up oci-env
        uses: ./.github/actions/pulp-oci-env
        with:
          domain-enabled: ${{ matrix.domains == 'enabled' }}

      - name: Restore backend image cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BACKEND_IMAGE }}
          key: pulp-backend-v3-${{ hashFiles('plugin-versions.txt', 'compose.env') }}

      - name: Load cached backend image
        run: |
          # Fast path; compose up rebuilds if absent.
          [ -f "${BACKEND_IMAGE}" ] && docker load -i "${BACKEND_IMAGE}" || true

      - name: Start Pulp (oci-env)
        run: oci-env -e compose.ci.env compose up -d

      - name: Wait for Pulp API
        run: |
          for i in $(seq 1 180); do
            if curl -fsS "${PULP_API_URL}/api/pulp/api/v3/status/" >/dev/null; then
              echo "Pulp is ready"
              exit 0
            fi
            echo "Waiting for Pulp... ($i)"
            sleep 5
          done
          echo "Pulp did not become ready in time"
          oci-env -e compose.ci.env compose logs --tail=200
          exit 1

      - name: Set Pulp admin password
        run: >
          oci-env -e compose.ci.env pulpcore-manager
          reset-admin-password --password "${E2E_PASSWORD}"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers (and deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: e2e

      - run: npx playwright test ${{ matrix.args }}
        working-directory: e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.name }}
          path: e2e/playwright-report/

      - name: Stop Pulp
        if: always()
        run: oci-env -e compose.ci.env compose down -v
