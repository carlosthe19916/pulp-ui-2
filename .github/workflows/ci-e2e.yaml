name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      PULP_API_URL: http://localhost:8080
      PULP_DOMAIN: default
      E2E_USERNAME: admin
      E2E_PASSWORD: password
    steps:
      - uses: actions/checkout@v6

      - name: Start Pulp
        run: docker compose -f docker-compose.e2e.yml up -d

      - name: Wait for Pulp API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS "${PULP_API_URL}/api/pulp/api/v3/status/" >/dev/null; then
              echo "Pulp is ready"
              exit 0
            fi
            echo "Waiting for Pulp... ($i)"
            sleep 5
          done
          echo "Pulp did not become ready in time"
          docker compose -f docker-compose.e2e.yml logs
          exit 1

      - name: Set Pulp admin password
        run: >
          docker compose -f docker-compose.e2e.yml exec -T pulp
          pulpcore-manager reset-admin-password --password "${E2E_PASSWORD}"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium
        working-directory: e2e

      - run: npx playwright test
        working-directory: e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Stop Pulp
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
