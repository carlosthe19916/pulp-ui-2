version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci(deps): "

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps): "

    allow:
      - dependency-type: direct

    groups:
      patternfly:
        patterns:
          - "@patternfly/*"

      "server dependencies":
        patterns:
          - cookie
          - ejs
          - express
          - http-proxy-middleware
          - http-terminator

      rollup:
        patterns:
          - "@rollup/*"
          - "rollup"
          - "rollup-*"

      linting-formatting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint-*"
          - "@eslint/*"
          - "*-eslint"
          - "typescript-eslint"
          - "prettier"
          - "oxlint"
          - "oxfmt"
          - "@oxlint/*"

      tools:
        patterns:
          - "vite"
          - "vite-*"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "@hey-api/*"
