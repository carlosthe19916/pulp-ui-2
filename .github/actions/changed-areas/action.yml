name: Detect changed areas
description: >-
  Classify a PR/push's changed files into "website", "app" and "image" areas so workflows
  can gate expensive jobs with a job-level `if:` (which reports a skipped — and
  therefore passing — required check, unlike an `on: paths` filter). The calling
  job must check out the repo first so this local action can be resolved.
outputs:
  website:
    description: true when website/** (or its own workflow) changed
    value: ${{ steps.website.outputs.website }}
  app:
    description: >-
      true when any file outside website/** and the docs changed (client, common,
      server, e2e, root/shared config, CI). Broad on purpose: unknown/shared files
      run the full client + e2e suite. The docs are docs/**, the root *.md files
      and LICENSE, which no build, lint or test reads.
    value: ${{ steps.app.outputs.app }}
  image:
    description: >-
      true when the container image's inputs changed: the npm dependencies of
      client, common and server (their package.json and the shared root
      package-lock.json), entrypoint.sh, the Dockerfile, .dockerignore or
      image-build.yaml
    value: ${{ steps.image.outputs.image }}
runs:
  using: composite
  steps:
    - id: website
      uses: dorny/paths-filter@v3
      with:
        filters: |
          website:
            - 'website/**'
            - '.github/workflows/website.yaml'
    # Separate step: `every` makes a file match only if it matches all patterns,
    # so the negations exclude website/** and the docs (with the default `some`,
    # '**' alone matches every file and app is always true). Markdown that a check
    # reads stays in: .rulesync/** (rules:check) and e2e/specs/** (spec:links).
    # Remove a docs exclusion if a build or test starts reading those files.
    - id: app
      uses: dorny/paths-filter@v3
      with:
        predicate-quantifier: every
        filters: |
          app:
            - '**'
            - '!website/**'
            - '!docs/**'
            - '!*.md'
            - '!LICENSE'
    - id: image
      uses: dorny/paths-filter@v3
      with:
        filters: |
          image:
            - 'package.json'
            - 'package-lock.json'
            - 'client/package.json'
            - 'common/package.json'
            - 'server/package.json'
            - 'entrypoint.sh'
            - 'Dockerfile'
            - '.dockerignore'
            - '.github/workflows/image-build.yaml'
