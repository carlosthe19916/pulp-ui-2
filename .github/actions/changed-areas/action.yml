name: Detect changed areas
description: >-
  Classify a PR/push's changed files into "website", "app" and "image" areas so workflows
  can gate expensive jobs with a job-level `if:` (which reports a skipped — and
  therefore passing — required check, unlike an `on: paths` filter). The calling
  job must check out the repo first so this local action can be resolved.
outputs:
  website:
    description: true when website/** (or its own workflow) changed
    value: ${{ steps.website.outputs.website }}
  app:
    description: >-
      true when any file outside website/** changed (client, common, server,
      e2e, root/shared config, CI). Broad on purpose: unknown/shared files run
      the full client + e2e suite.
    value: ${{ steps.app.outputs.app }}
  image:
    description: >-
      true when the container image's inputs changed: the npm dependencies of
      client, common and server (their package.json and the shared root
      package-lock.json), entrypoint.sh, the Dockerfile, .dockerignore or
      image-build.yaml
    value: ${{ steps.image.outputs.image }}
runs:
  using: composite
  steps:
    - id: website
      uses: dorny/paths-filter@v3
      with:
        filters: |
          website:
            - 'website/**'
            - '.github/workflows/website.yaml'
    # Separate step: `every` makes a file match only if it matches all patterns,
    # so the negation excludes website/** (with the default `some`, '**' alone
    # matches every file and app is always true).
    - id: app
      uses: dorny/paths-filter@v3
      with:
        predicate-quantifier: every
        filters: |
          app:
            - '**'
            - '!website/**'
    - id: image
      uses: dorny/paths-filter@v3
      with:
        filters: |
          image:
            - 'package.json'
            - 'package-lock.json'
            - 'client/package.json'
            - 'common/package.json'
            - 'server/package.json'
            - 'entrypoint.sh'
            - 'Dockerfile'
            - '.dockerignore'
            - '.github/workflows/image-build.yaml'
