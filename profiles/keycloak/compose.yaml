services:
  pulp-ui-2-keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: "{KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "{KEYCLOAK_ADMIN_PASSWORD}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME: "http://localhost:{KEYCLOAK_PORT}"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "{KEYCLOAK_PORT}:8080"
    command: ["start-dev"]

  pulp-ui-2-keycloak-wait:
    image: docker.io/alpine/curl:latest
    volumes:
      - "{SRC_DIR}/pulp-ui-2/profiles/keycloak/kc-wait.sh:/tmp/kc-wait.sh:Z"
    entrypoint: ["/bin/sh"]
    command: /tmp/kc-wait.sh
    environment:
      SERVER_URL: "http://pulp-ui-2-keycloak:8080"
    depends_on:
      pulp-ui-2-keycloak:
        condition: service_started

  pulp-ui-2-keycloak-init:
    image: quay.io/keycloak/keycloak:latest
    volumes:
      - "{SRC_DIR}/pulp-ui-2/profiles/keycloak/kc-init.sh:/tmp/kc-init.sh:Z"
    entrypoint: ["/bin/sh"]
    command: /tmp/kc-init.sh
    environment:
      SERVER_URL: "http://pulp-ui-2-keycloak:8080"
      KEYCLOAK_REALM: "{KEYCLOAK_REALM}"
      KEYCLOAK_ADMIN: "{KEYCLOAK_ADMIN}"
      KEYCLOAK_ADMIN_PASSWORD: "{KEYCLOAK_ADMIN_PASSWORD}"
      KEYCLOAK_UI_CLIENT_ID: "{KEYCLOAK_UI_CLIENT_ID}"
      KEYCLOAK_DEV_USER: "{KEYCLOAK_DEV_USER}"
      KEYCLOAK_DEV_PASSWORD: "{KEYCLOAK_DEV_PASSWORD}"
    depends_on:
      pulp-ui-2-keycloak-wait:
        condition: service_completed_successfully

  # Authenticating gateway in front of Pulp: validates the UI's Keycloak Bearer
  # JWT and injects a trusted X-Forwarded-Preferred-Username that Pulp accepts via
  # PulpRemoteUserAuthentication. Pulp's official external-auth pattern
  # (docs/admin/guides/auth/external.md); Pulp never validates the JWT. The UI's
  # PULP_API_URL targets this service, not Pulp directly.
  #
  # No depends_on: podman-compose maps it to podman --requires, which restarts the
  # exited keycloak-init one-shot and stalls in "Created". Not needed anyway --
  # SKIP_OIDC_DISCOVERY makes oauth2-proxy fetch JWKS lazily on the first token.
  pulp-ui-2-gateway:
    image: quay.io/oauth2-proxy/oauth2-proxy:latest
    ports:
      - "{KEYCLOAK_GATEWAY_PORT}:4180"
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "{API_PROTOCOL}://pulp:{API_PORT}"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_PROVIDER: "oidc"
      OAUTH2_PROXY_CLIENT_ID: "{KEYCLOAK_UI_CLIENT_ID}"
      # Public SPA client; the bearer path never redeems a code. Placeholder to
      # satisfy config validation.
      OAUTH2_PROXY_CLIENT_SECRET: "unused-public-client"
      OAUTH2_PROXY_COOKIE_SECRET: "{GATEWAY_COOKIE_SECRET}"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      # Accept a valid Authorization: Bearer JWT instead of an interactive login flow.
      OAUTH2_PROXY_SKIP_JWT_BEARER_TOKENS: "true"
      # Split-horizon: tokens' iss is localhost:{KEYCLOAK_PORT} (browser-facing) but
      # the gateway reaches Keycloak internally. Skip discovery; point JWKS/endpoints
      # at the internal host, keep the localhost issuer for iss/aud checks.
      OAUTH2_PROXY_SKIP_OIDC_DISCOVERY: "true"
      OAUTH2_PROXY_OIDC_ISSUER_URL: "http://localhost:{KEYCLOAK_PORT}/realms/{KEYCLOAK_REALM}"
      OAUTH2_PROXY_LOGIN_URL: "http://localhost:{KEYCLOAK_PORT}/realms/{KEYCLOAK_REALM}/protocol/openid-connect/auth"
      OAUTH2_PROXY_REDEEM_URL: "http://pulp-ui-2-keycloak:8080/realms/{KEYCLOAK_REALM}/protocol/openid-connect/token"
      OAUTH2_PROXY_OIDC_JWKS_URL: "http://pulp-ui-2-keycloak:8080/realms/{KEYCLOAK_REALM}/protocol/openid-connect/certs"
      OAUTH2_PROXY_INSECURE_OIDC_SKIP_ISSUER_VERIFICATION: "true"
      # Dev users have no verified email; oauth2-proxy would reject their tokens otherwise.
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      # Emit X-Forwarded-Preferred-Username/-User/-Email from the validated token.
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "true"
