# pip settings for the tutorial: pip reads $PIP_CONFIG_FILE, so `export PIP_CONFIG_FILE=$PWD/pip.conf`
# or copy these lines to ~/.config/pip/pip.conf (replace the URLs with your distributions').
[global]
# Everything resolves through the Pulp cache of pypi.org...
index-url = http://localhost:5003/pypi/default/pypi-proxy/simple/
# ...and your own packages come from the hosted index.
extra-index-url = http://localhost:5003/pypi/default/pypi-hosted/simple/
