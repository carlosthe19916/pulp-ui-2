# Galaxy servers for the tutorial: ansible-galaxy tries them in order.
[galaxy]
server_list = pulp_hosted, pulp_upstream

# Your own collections; ansible-galaxy collection publish uploads here.
[galaxy_server.pulp_hosted]
url = http://localhost:5003/pulp_ansible/galaxy/default/ansible-hosted/
username = admin
password = password

# The mirror of the collections you need from galaxy.ansible.com.
[galaxy_server.pulp_upstream]
url = http://localhost:5003/pulp_ansible/galaxy/default/ansible-upstream/
username = admin
password = password
